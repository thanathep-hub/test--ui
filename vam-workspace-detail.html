<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f5fa" />
  <title>VAM Workspace — Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans Thai','ui-sans-serif','system-ui','sans-serif']}}}}</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
    :root{color-scheme:light} *{-webkit-tap-highlight-color:transparent}
    body{background:#e7ebf2}.screen{min-height:100svh;padding-bottom:max(108px,calc(84px + env(safe-area-inset-bottom)))}
    .pressable{transition:transform .18s ease,box-shadow .18s ease}.pressable:active{transform:scale(.975)}
    .safe-top{padding-top:max(18px,env(safe-area-inset-top))}
    .module-art{filter:drop-shadow(0 8px 10px rgba(27,45,70,.12))}
    @media(min-width:560px){.phone{max-width:430px;min-height:900px;margin:24px auto;border-radius:42px;overflow:hidden;box-shadow:0 30px 80px rgba(24,39,64,.22)}.telegram-fab{left:calc(50% - 195px)!important}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body class="font-sans text-slate-900 antialiased" data-variant="detail">
  <main class="phone relative bg-[#f2f5fa]">
    <section class="screen safe-top">
      <header class="px-5 pt-3">
        <div class="relative overflow-hidden rounded-[30px] bg-[#182f51] p-5 text-white shadow-[0_18px_45px_rgba(24,47,81,.25)]">
          <div class="absolute -right-10 -top-16 h-44 w-44 rounded-full border-[34px] border-white/[.035]"></div>
          <div class="relative flex items-center justify-between">
            <div class="flex items-center gap-3.5">
              <div class="grid h-12 w-12 place-items-center rounded-2xl bg-white/10 ring-1 ring-white/10" aria-hidden="true">
                <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
              </div>
              <div><p class="text-[20px] font-bold tracking-tight">VAM <span class="text-[#69a5ff]">Workspace</span></p><p class="mt-0.5 text-xs text-blue-100/65">Vehicle Analysis Management</p></div>
            </div>
            <button class="pressable grid h-11 w-11 place-items-center rounded-full bg-white/10" aria-label="ออกจากระบบ"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/></svg></button>
          </div>
        </div>
      </header>

      <div class="px-5 pb-5 pt-7">
        <div class="mb-4 flex items-end justify-between">
          <div><p class="text-xs font-semibold uppercase tracking-[.18em] text-blue-600">Workspace</p><h1 class="mt-1 text-[27px] font-bold leading-tight tracking-[-.02em]">เลือกระบบที่ต้องการ</h1></div>
          <div class="rounded-full bg-white px-3 py-2 text-xs font-semibold text-slate-500 shadow-sm">5 ระบบ</div>
        </div>

        <button class="pressable relative min-h-[128px] w-full overflow-hidden rounded-[26px] bg-[#215fae] p-4 text-left text-white shadow-[0_16px_38px_rgba(33,95,174,.23)]">
          <div class="absolute -bottom-8 -right-2 text-[112px] font-bold leading-none text-white/[.05]">01</div>
          <div class="relative flex items-center gap-3.5">
            <div class="grid h-[78px] w-[92px] shrink-0 place-items-center rounded-[20px] bg-white/95"><img src="assets/vam-icons/fleet-3d.png" alt="" class="module-art h-[76px] w-[88px] object-contain" /></div>
            <div class="min-w-0 flex-1"><p class="text-[11px] font-medium text-blue-100">ระบบหลัก</p><h2 class="mt-0.5 text-[19px] font-bold">Fleet Management</h2><p class="mt-1 text-xs text-blue-100/80">ภาพรวมรถ ค่าใช้จ่าย และสถานะงาน</p></div>
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </button>

        <div class="mt-3 grid grid-cols-2 gap-3">
          <button class="pressable relative min-h-[140px] overflow-hidden rounded-[22px] bg-white p-3.5 text-left shadow-[0_8px_24px_rgba(36,55,82,.08)]">
            <img src="assets/vam-icons/booking-3d.png" alt="" class="module-art h-[72px] w-[84px] object-contain object-left" />
            <h3 class="mt-2 font-bold">การขอใช้รถ</h3><p class="mt-1 text-xs leading-5 text-slate-500">จองรถและติดตามการอนุมัติ</p>
          </button>
          <button class="pressable relative min-h-[140px] overflow-hidden rounded-[22px] bg-white p-3.5 text-left shadow-[0_8px_24px_rgba(36,55,82,.08)]">
            <span class="absolute right-3 top-3 grid h-6 min-w-6 place-items-center rounded-full bg-[#ff5d3d] px-1.5 text-[11px] font-bold text-white shadow-sm ring-2 ring-white" aria-label="รายการแจ้งซ่อมใหม่ 2 รายการ" data-testid="repair-notification-badge">2</span><img src="assets/vam-icons/repair-3d.png" alt="" class="module-art h-[72px] w-[84px] object-contain object-left" />
            <h3 class="mt-2 font-bold">แจ้งซ่อม</h3><p class="mt-1 text-xs leading-5 text-slate-500">แจ้งปัญหาและรับเรื่องซ่อม</p>
          </button>
          <button class="pressable relative min-h-[140px] overflow-hidden rounded-[22px] bg-white p-3.5 text-left shadow-[0_8px_24px_rgba(36,55,82,.08)]">
            <img src="assets/vam-icons/ai-3d.png" alt="" class="module-art h-[72px] w-[84px] object-contain object-left" />
            <h3 class="mt-2 font-bold">VAM AI</h3><p class="mt-1 text-xs leading-5 text-slate-500">ค้นหาและสรุปข้อมูลรถ</p>
          </button>
          <button class="pressable relative min-h-[140px] overflow-hidden rounded-[22px] bg-white p-3.5 text-left shadow-[0_8px_24px_rgba(36,55,82,.08)]">
            <img src="assets/vam-icons/permissions-3d.png" alt="" class="module-art h-[72px] w-[84px] object-contain object-left" />
            <h3 class="mt-2 font-bold">จัดการสิทธิ์</h3><p class="mt-1 text-xs leading-5 text-slate-500">กำหนดสิทธิ์การเข้าถึง</p>
          </button>
        </div>
      </div>

      <button class="telegram-fab pressable fixed bottom-5 left-5 z-30 flex min-h-[54px] items-center justify-center gap-2.5 rounded-full bg-[#269ed1] px-5 font-semibold text-white shadow-[0_14px_32px_rgba(38,158,209,.3)]" data-testid="executive-telegram">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 3L9 15M21 3l-7 18-5-6-6-3z"/></svg>เชื่อมต่อ Telegram
      </button>
    </section>
  </main>
</body>
</html>
