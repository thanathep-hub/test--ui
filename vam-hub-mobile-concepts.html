<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f5fa" />
  <title>VAM Hub — Mobile UI Concepts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Noto Sans Thai','ui-sans-serif','system-ui','sans-serif'] } } } }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
    :root { color-scheme: light; }
    * { -webkit-tap-highlight-color: transparent; }
    body { background: #e7ebf2; }
    .screen { min-height: 100svh; padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
    .concept { display: none; }
    .concept.active { display: block; animation: reveal .42s cubic-bezier(.22,1,.36,1) both; }
    .concept-btn[aria-selected="true"] { background:#172d4d; color:#fff; box-shadow:0 8px 20px rgba(23,45,77,.2); }
    .pressable { transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    .pressable:active { transform: scale(.975); }
    .safe-top { padding-top: max(18px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    @keyframes reveal { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
    @media (min-width: 560px) { .phone { max-width:430px; min-height:900px; margin:24px auto; border-radius:42px; overflow:hidden; box-shadow:0 30px 80px rgba(24,39,64,.22); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body class="font-sans text-slate-900 antialiased">
  <div class="mx-auto max-w-[430px] px-3 pt-3 sm:max-w-xl" aria-label="ตัวเลือกแนวทางการออกแบบ">
    <div class="grid grid-cols-3 gap-1 rounded-2xl bg-white/80 p-1.5 shadow-sm backdrop-blur-xl">
      <button class="concept-btn min-h-11 rounded-xl px-2 text-xs font-semibold text-slate-500" data-target="executive" aria-selected="true">Executive</button>
      <button class="concept-btn min-h-11 rounded-xl px-2 text-xs font-semibold text-slate-500" data-target="grouped" aria-selected="false">iOS Grouped</button>
      <button class="concept-btn min-h-11 rounded-xl px-2 text-xs font-semibold text-slate-500" data-target="operations" aria-selected="false">Operations</button>
    </div>
  </div>

  <main class="phone relative bg-[#f2f5fa]">
    <section id="executive" class="concept active screen safe-top">
      <header class="px-5 pt-3">
        <div class="relative overflow-hidden rounded-[30px] bg-[#182f51] p-5 text-white shadow-[0_18px_45px_rgba(24,47,81,.25)]">
          <div class="absolute -right-10 -top-16 h-44 w-44 rounded-full border-[34px] border-white/[.035]"></div>
          <div class="relative flex items-center justify-between">
            <div class="flex items-center gap-3.5">
              <div class="grid h-12 w-12 place-items-center rounded-2xl bg-white/10 ring-1 ring-white/10" aria-hidden="true">
                <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
              </div>
              <div><p class="text-[22px] font-bold tracking-tight">VAM <span class="text-[#69a5ff]">Hub</span></p><p class="mt-0.5 text-xs text-blue-100/65">Vehicle Analysis Management</p></div>
            </div>
            <button class="pressable grid h-11 w-11 place-items-center rounded-full bg-white/10" aria-label="ออกจากระบบ">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/></svg>
            </button>
          </div>
        </div>
      </header>
      <div class="px-5 pb-5 pt-8">
        <div class="mb-5 flex items-end justify-between"><div><p class="text-xs font-semibold uppercase tracking-[.18em] text-blue-600">Workspace</p><h1 class="mt-1 text-[27px] font-bold leading-tight tracking-[-.02em]">เลือกระบบที่ต้องการ</h1></div><div class="rounded-full bg-white px-3 py-2 text-xs font-semibold text-slate-500 shadow-sm">5 ระบบ</div></div>
        <button class="pressable relative w-full overflow-hidden rounded-[28px] bg-[#215fae] p-5 text-left text-white shadow-[0_16px_38px_rgba(33,95,174,.23)]">
          <div class="absolute -bottom-10 -right-3 text-[130px] font-bold leading-none text-white/[.055]">01</div>
          <div class="relative flex items-center gap-4"><div class="grid h-[62px] w-[62px] shrink-0 place-items-center rounded-[20px] bg-white text-[#215fae]"><svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 16l2-6h14l2 6v4h-2v-2H5v2H3z"/><path d="M7 10l1.5-4h7L17 10M7 14h.01M17 14h.01"/></svg></div><div class="min-w-0 flex-1"><p class="text-xs font-medium text-blue-100">ระบบหลัก</p><h2 class="mt-0.5 text-xl font-bold">Fleet Management</h2><p class="mt-1 text-sm text-blue-100/80">ภาพรวมรถ ค่าใช้จ่าย และสถานะงาน</p></div><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
        </button>
        <div class="mt-3 grid grid-cols-2 gap-3">
          <button class="pressable min-h-[154px] rounded-[24px] bg-white p-4 text-left shadow-[0_8px_24px_rgba(36,55,82,.08)]"><span class="grid h-11 w-11 place-items-center rounded-2xl bg-blue-50 text-blue-600"><svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 16l1.5-5h13l1.5 5M7 11l1-3h8l1 3M6 19h12M8 16h.01M16 16h.01"/></svg></span><h3 class="mt-4 font-bold">การขอใช้รถ</h3><p class="mt-1 text-xs leading-5 text-slate-500">จองรถและติดตามการอนุมัติ</p></button>
          <button class="pressable min-h-[154px] rounded-[24px] bg-white p-4 text-left shadow-[0_8px_24px_rgba(36,55,82,.08)]"><span class="grid h-11 w-11 place-items-center rounded-2xl bg-orange-50 text-orange-600"><svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 01-5 5L4 17l3 3 5.7-5.7a4 4 0 005-5z"/></svg></span><h3 class="mt-4 font-bold">แจ้งซ่อม</h3><p class="mt-1 text-xs leading-5 text-slate-500">แจ้งปัญหาและรับเรื่องซ่อม</p></button>
          <button class="pressable min-h-[154px] rounded-[24px] bg-white p-4 text-left shadow-[0_8px_24px_rgba(36,55,82,.08)]"><span class="grid h-11 w-11 place-items-center rounded-2xl bg-amber-50 text-amber-600"><svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 8h6M8 4h8l1 4H7zM5 8h14v11H5zM9 12v3M15 12v3"/></svg></span><h3 class="mt-4 font-bold">VAM AI</h3><p class="mt-1 text-xs leading-5 text-slate-500">ค้นหาและสรุปข้อมูลรถ</p></button>
          <button class="pressable min-h-[154px] rounded-[24px] bg-white p-4 text-left shadow-[0_8px_24px_rgba(36,55,82,.08)]"><span class="grid h-11 w-11 place-items-center rounded-2xl bg-emerald-50 text-emerald-600"><svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span><h3 class="mt-4 font-bold">จัดการสิทธิ์</h3><p class="mt-1 text-xs leading-5 text-slate-500">กำหนดสิทธิ์การเข้าถึง</p></button>
        </div>
      </div>
      <nav class="safe-bottom fixed bottom-0 left-1/2 z-20 flex w-full max-w-[430px] -translate-x-1/2 items-center justify-around border-t border-slate-200/80 bg-white/90 px-5 pt-2 backdrop-blur-xl" aria-label="เมนูหลัก">
        <button class="min-h-12 min-w-16 text-blue-600"><svg class="mx-auto h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9H3z"/></svg><span class="mt-1 block text-[10px] font-semibold">หน้าหลัก</span></button><button class="min-h-12 min-w-16 text-slate-400"><svg class="mx-auto h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16"/></svg><span class="mt-1 block text-[10px]">รายการ</span></button><button class="min-h-12 min-w-16 text-slate-400"><svg class="mx-auto h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg><span class="mt-1 block text-[10px]">สถานะ</span></button><button class="min-h-12 min-w-16 text-slate-400"><svg class="mx-auto h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M5 21a7 7 0 0114 0"/></svg><span class="mt-1 block text-[10px]">บัญชี</span></button>
      </nav>
    </section>

    <section id="grouped" class="concept screen safe-top bg-[#f4f5f7]">
      <header class="px-5 pt-3"><div class="flex items-center justify-between"><div><p class="text-sm font-semibold text-blue-600">VAM Hub</p><h1 class="mt-1 text-[34px] font-bold tracking-[-.035em]">ระบบของคุณ</h1></div><button class="grid h-12 w-12 place-items-center rounded-full bg-white text-[#18304f] shadow-sm" aria-label="โปรไฟล์"><span class="text-sm font-bold">VA</span></button></div><p class="mt-2 max-w-xs text-sm leading-6 text-slate-500">เข้าถึงเครื่องมือบริหารจัดการยานพาหนะได้จากที่เดียว</p></header>
      <div class="px-5 pt-6">
        <label class="flex h-12 items-center gap-3 rounded-2xl bg-[#e6e8ec] px-4 text-slate-500"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input class="w-full bg-transparent text-sm outline-none placeholder:text-slate-400" placeholder="ค้นหาระบบ" aria-label="ค้นหาระบบ" /></label>
        <div class="mt-7"><div class="mb-2 flex items-center justify-between px-1"><h2 class="text-[13px] font-semibold uppercase tracking-[.12em] text-slate-500">รายการโปรด</h2><button class="text-sm font-semibold text-blue-600">แก้ไข</button></div>
          <div class="overflow-hidden rounded-[22px] bg-white shadow-[0_4px_18px_rgba(35,48,68,.06)]">
            <button class="pressable flex min-h-[82px] w-full items-center gap-4 px-4 text-left"><span class="grid h-12 w-12 place-items-center rounded-[14px] bg-[#1c61b8] text-white"><svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 16l2-6h14l2 6v4h-2v-2H5v2H3z"/><path d="M7 10l1.5-4h7L17 10"/></svg></span><span class="flex-1"><strong class="block text-[15px]">Fleet Management</strong><span class="mt-1 block text-xs text-slate-500">ภาพรวมการบริหารยานพาหนะ</span></span><svg class="h-5 w-5 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
            <div class="ml-20 border-t border-slate-100"></div>
            <button class="pressable flex min-h-[82px] w-full items-center gap-4 px-4 text-left"><span class="grid h-12 w-12 place-items-center rounded-[14px] bg-[#e97623] text-white"><svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 01-5 5L4 17l3 3 5.7-5.7a4 4 0 005-5z"/></svg></span><span class="flex-1"><strong class="block text-[15px]">แจ้งซ่อม</strong><span class="mt-1 block text-xs text-slate-500">สร้างและติดตามรายการซ่อม</span></span><span class="rounded-full bg-red-50 px-2 py-1 text-[10px] font-bold text-red-600">2 งาน</span><svg class="h-5 w-5 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
          </div>
        </div>
        <div class="mt-7"><h2 class="mb-2 px-1 text-[13px] font-semibold uppercase tracking-[.12em] text-slate-500">ระบบทั้งหมด</h2><div class="overflow-hidden rounded-[22px] bg-white shadow-[0_4px_18px_rgba(35,48,68,.06)]" id="grouped-list"></div></div>
        <button class="pressable mt-7 flex w-full items-center justify-center gap-2 rounded-2xl bg-[#2a9fd6] px-5 py-3.5 font-semibold text-white shadow-[0_10px_24px_rgba(42,159,214,.2)]"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 3L9 15M21 3l-7 18-5-6-6-3z"/></svg>เชื่อมต่อ Telegram</button>
      </div>
    </section>

    <section id="operations" class="concept screen safe-top bg-[#f7f8fa]">
      <header class="px-5 pt-3"><div class="flex items-center justify-between"><div class="flex items-center gap-3"><div class="grid h-11 w-11 place-items-center rounded-[15px] bg-[#172d4d] text-white"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></div><div><p class="text-lg font-bold">VAM Hub</p><p class="text-xs text-slate-500">ศูนย์บริหารยานพาหนะ</p></div></div><button class="grid h-11 w-11 place-items-center rounded-full border border-slate-200 bg-white" aria-label="การแจ้งเตือน"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button></div></header>
      <div class="px-5 pt-8"><p class="text-sm font-medium text-slate-500">สวัสดี, ทีมปฏิบัติการ</p><h1 class="mt-1 text-[30px] font-bold leading-tight tracking-[-.03em]">วันนี้ต้องจัดการ<br><span class="text-blue-600">เรื่องไหนก่อน?</span></h1>
        <button class="pressable relative mt-6 w-full overflow-hidden rounded-[30px] bg-[#172d4d] p-5 text-left text-white shadow-[0_18px_40px_rgba(23,45,77,.22)]"><div class="absolute right-[-30px] top-[-20px] h-36 w-36 rounded-full bg-blue-400/10"></div><p class="text-xs font-semibold uppercase tracking-[.16em] text-blue-200">Quick access</p><div class="mt-8 flex items-end justify-between"><div><h2 class="text-2xl font-bold">Fleet Overview</h2><p class="mt-2 text-sm text-blue-100/70">ดูสถานะรถทั้งหมดในภาพรวม</p></div><span class="grid h-12 w-12 place-items-center rounded-full bg-white text-[#172d4d]"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div></button>
        <div class="mt-7 flex items-center justify-between"><h2 class="text-lg font-bold">เครื่องมือ</h2><button class="text-sm font-semibold text-blue-600">ดูทั้งหมด</button></div>
        <div class="mt-3 space-y-2.5" id="operations-list"></div>
        <button class="pressable mt-3 flex min-h-[70px] w-full items-center gap-4 rounded-[21px] border border-dashed border-slate-300 px-4 text-left text-slate-400"><span class="grid h-11 w-11 place-items-center rounded-2xl bg-slate-100"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span><span><strong class="block text-sm">ระบบเพิ่มเติม</strong><span class="text-xs">เร็ว ๆ นี้</span></span></button>
      </div>
    </section>
  </main>

  <script>
    const modules = [
      {name:'การขอใช้รถ', desc:'จองรถและติดตามการอนุมัติ', color:'#2878d0', icon:'car'},
      {name:'VAM AI', desc:'ผู้ช่วยค้นหาและสรุปข้อมูล', color:'#d68a16', icon:'ai'},
      {name:'จัดการสิทธิ์', desc:'ดูแลสิทธิ์ผู้ใช้งาน', color:'#138f7e', icon:'shield'}
    ];
    const icons = {
      car:'<path d="M4 16l1.5-5h13l1.5 5M7 11l1-3h8l1 3M6 19h12M8 16h.01M16 16h.01"/>',
      ai:'<path d="M9 8h6M8 4h8l1 4H7zM5 8h14v11H5zM9 12v3M15 12v3"/>',
      shield:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'
    };
    const svg = key => `<svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${icons[key]}</svg>`;
    document.querySelector('#grouped-list').innerHTML = modules.map((m,i)=>`<button class="pressable flex min-h-[72px] w-full items-center gap-4 px-4 text-left ${i?'border-t border-slate-100':''}"><span class="grid h-11 w-11 place-items-center rounded-[14px] text-white" style="background:${m.color}">${svg(m.icon)}</span><span class="flex-1"><strong class="block text-[15px]">${m.name}</strong><span class="mt-0.5 block text-xs text-slate-500">${m.desc}</span></span><svg class="h-5 w-5 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>`).join('');
    document.querySelector('#operations-list').innerHTML = modules.map(m=>`<button class="pressable flex min-h-[78px] w-full items-center gap-4 rounded-[21px] bg-white px-4 text-left shadow-[0_5px_18px_rgba(35,48,68,.055)]"><span class="grid h-12 w-12 place-items-center rounded-[16px] text-white" style="background:${m.color}">${svg(m.icon)}</span><span class="flex-1"><strong class="block text-[15px]">${m.name}</strong><span class="mt-1 block text-xs text-slate-500">${m.desc}</span></span><svg class="h-5 w-5 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>`).join('');
    const showConcept = id => {
      document.querySelectorAll('.concept').forEach(el=>el.classList.toggle('active',el.id===id));
      document.querySelectorAll('.concept-btn').forEach(btn=>btn.setAttribute('aria-selected',btn.dataset.target===id));
      history.replaceState(null,'','#'+id);
      scrollTo({top:0,behavior:'smooth'});
    };
    document.querySelectorAll('.concept-btn').forEach(btn=>btn.addEventListener('click',()=>showConcept(btn.dataset.target)));
    const initial = location.hash.slice(1); if (['executive','grouped','operations'].includes(initial)) showConcept(initial);
  </script>
</body>
</html>
