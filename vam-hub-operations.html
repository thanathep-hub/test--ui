<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f5fa" />
  <title>VAM Hub — Operations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Noto Sans Thai','ui-sans-serif','system-ui','sans-serif'] } } } }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
    :root { color-scheme: light; }
    * { -webkit-tap-highlight-color: transparent; }
    body { background: #e7ebf2; }
    .screen { min-height: 100svh; padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
    .pressable { transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    .pressable:active { transform: scale(.975); }
    .safe-top { padding-top: max(18px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    @keyframes reveal { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
    @media (min-width: 560px) { .phone { max-width:430px; min-height:900px; margin:24px auto; border-radius:42px; overflow:hidden; box-shadow:0 30px 80px rgba(24,39,64,.22); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body class="font-sans text-slate-900 antialiased">
  <main class="phone relative bg-[#f2f5fa]">
    <section id="operations" class="screen safe-top bg-[#f7f8fa]">
      <header class="px-5 pt-3"><div class="flex items-center justify-between"><div class="flex items-center gap-3"><div class="grid h-11 w-11 place-items-center rounded-[15px] bg-[#172d4d] text-white"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></div><div><p class="text-lg font-bold">VAM Hub</p><p class="text-xs text-slate-500">ศูนย์บริหารยานพาหนะ</p></div></div><button class="grid h-11 w-11 place-items-center rounded-full border border-slate-200 bg-white" aria-label="การแจ้งเตือน"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button></div></header>
      <div class="px-5 pt-8"><p class="text-sm font-medium text-slate-500">สวัสดี, ทีมปฏิบัติการ</p><h1 class="mt-1 text-[30px] font-bold leading-tight tracking-[-.03em]">วันนี้ต้องจัดการ<br><span class="text-blue-600">เรื่องไหนก่อน?</span></h1>
        <button class="pressable relative mt-6 w-full overflow-hidden rounded-[30px] bg-[#172d4d] p-5 text-left text-white shadow-[0_18px_40px_rgba(23,45,77,.22)]"><div class="absolute right-[-30px] top-[-20px] h-36 w-36 rounded-full bg-blue-400/10"></div><p class="text-xs font-semibold uppercase tracking-[.16em] text-blue-200">Quick access</p><div class="mt-8 flex items-end justify-between"><div><h2 class="text-2xl font-bold">Fleet Overview</h2><p class="mt-2 text-sm text-blue-100/70">ดูสถานะรถทั้งหมดในภาพรวม</p></div><span class="grid h-12 w-12 place-items-center rounded-full bg-white text-[#172d4d]"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div></button>
        <div class="mt-7 flex items-center justify-between"><h2 class="text-lg font-bold">เครื่องมือ</h2><button class="text-sm font-semibold text-blue-600">ดูทั้งหมด</button></div>
        <div class="mt-3 space-y-2.5" id="operations-list"></div>
        <button class="pressable mt-3 flex min-h-[70px] w-full items-center gap-4 rounded-[21px] border border-dashed border-slate-300 px-4 text-left text-slate-400"><span class="grid h-11 w-11 place-items-center rounded-2xl bg-slate-100"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span><span><strong class="block text-sm">ระบบเพิ่มเติม</strong><span class="text-xs">เร็ว ๆ นี้</span></span></button>
      </div>
    </section>
  </main>
  <script>
    const modules = [
      {name:'การขอใช้รถ', desc:'จองรถและติดตามการอนุมัติ', color:'#2878d0', icon:'car'},
      {name:'VAM AI', desc:'ผู้ช่วยค้นหาและสรุปข้อมูล', color:'#d68a16', icon:'ai'},
      {name:'จัดการสิทธิ์', desc:'ดูแลสิทธิ์ผู้ใช้งาน', color:'#138f7e', icon:'shield'}
    ];
    const icons = {
      car:'<path d="M4 16l1.5-5h13l1.5 5M7 11l1-3h8l1 3M6 19h12M8 16h.01M16 16h.01"/>',
      ai:'<path d="M9 8h6M8 4h8l1 4H7zM5 8h14v11H5zM9 12v3M15 12v3"/>',
      shield:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'
    };
    const svg = key => `<svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${icons[key]}</svg>`;
    const groupedList = document.querySelector('#grouped-list');
    if (groupedList) groupedList.innerHTML = modules.map((m,i)=>`<button class="pressable flex min-h-[72px] w-full items-center gap-4 px-4 text-left ${i?'border-t border-slate-100':''}"><span class="grid h-11 w-11 place-items-center rounded-[14px] text-white" style="background:${m.color}">${svg(m.icon)}</span><span class="flex-1"><strong class="block text-[15px]">${m.name}</strong><span class="mt-0.5 block text-xs text-slate-500">${m.desc}</span></span><svg class="h-5 w-5 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>`).join('');
    const operationsList = document.querySelector('#operations-list');
    if (operationsList) operationsList.innerHTML = modules.map(m=>`<button class="pressable flex min-h-[78px] w-full items-center gap-4 rounded-[21px] bg-white px-4 text-left shadow-[0_5px_18px_rgba(35,48,68,.055)]"><span class="grid h-12 w-12 place-items-center rounded-[16px] text-white" style="background:${m.color}">${svg(m.icon)}</span><span class="flex-1"><strong class="block text-[15px]">${m.name}</strong><span class="mt-1 block text-xs text-slate-500">${m.desc}</span></span><svg class="h-5 w-5 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>`).join('');
  </script>
</body>
</html>
